name: Daily digest

on:
  schedule:
    # 22:37 UTC Sun-Thu = 06:37 Malaysia time (MYT = UTC+8, no daylight saving)
    # Mon-Fri, aiming to land by 07:00. GitHub Actions cron is best-effort:
    # on-the-hour slots regularly run 1-2 hours late, so an off-peak minute is
    # used deliberately.
    - cron: "37 22 * * 0-4"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_digest.py
