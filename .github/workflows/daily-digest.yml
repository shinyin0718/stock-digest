name: Daily digest

on:
  # Triggered at 06:55 Malaysia time Mon-Fri by an external scheduler
  # (cron-job.org) calling the workflow_dispatch API; see README section 3.
  # A GitHub `schedule:` cron was used before but fired 2.5-4 hours late on
  # the free tier, so it was removed.
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_digest.py
